<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบปรับอากาศห้องผ่าตัด</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OR HVAC">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: a technical explainer for engineers and technicians, dressed as a command-console
   IDEA a sci-fi engineering console showing a live P&ID you can click into, matching the unit's navy-and-gold crest
   PICTURE the schematic, 2/3 of the screen, every block a metallic plate you can open
   COLOUR deep navy ground, gold and brushed-steel trim, one metallic hue per subsystem
   TYPE Chakra Petch for titles and plates, IBM Plex Sans Thai for reading
   LAYOUT laptop: crest strip, menu bar with system switch on the right, schematic 2/3 + narration 1/3; phone: schematic scrolls sideways, narration is a bottom sheet */
:root{color-scheme:dark;--bg:#050b1a;--bg2:#0a1430;--card:#0c1834;--ink:#e8eefc;--muted:#93a6c9;--gold:#d9b24c;--gold2:#f4d98a;--line:rgba(217,178,76,.28);--steel:#8fa3c7}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.strip{display:flex;align-items:center;gap:14px;padding:10px max(16px,2vw);padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,#0d1d45,#071028);border-bottom:1px solid var(--gold);box-shadow:0 1px 0 rgba(244,217,138,.25),0 6px 24px rgba(0,0,0,.45)}
.strip img{height:52px;width:auto;flex:none;filter:drop-shadow(0 0 8px rgba(217,178,76,.35))}
.strip h1{margin:0 auto 0 0;font:700 clamp(18px,2.2vw,26px)/1.15 "Chakra Petch","IBM Plex Sans Thai",sans-serif;letter-spacing:.01em;background:linear-gradient(180deg,#fff6d6 0%,#f4d98a 40%,#b98a2a 60%,#f1cf73 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tgl{border:1px solid var(--gold);background:linear-gradient(180deg,rgba(244,217,138,.18),rgba(217,178,76,.05));color:var(--gold2);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;font:600 14px "Chakra Petch","IBM Plex Sans Thai",sans-serif;flex:none}
.tgl:hover{background:rgba(217,178,76,.22)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;padding:6px max(16px,2vw);background:linear-gradient(180deg,#0b1736,#081129);border-bottom:1px solid var(--line)}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:thin}
.nav button{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;font:500 14px "Chakra Petch","IBM Plex Sans Thai",sans-serif;min-height:40px;color:var(--muted);border-bottom:2px solid transparent}
.nav button:hover{color:var(--ink)}
.nav button[aria-current=page]{color:var(--gold2);border-bottom-color:var(--gold);background:linear-gradient(180deg,transparent,rgba(217,178,76,.12));border-radius:8px 8px 0 0}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:#06102a}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;min-height:36px;font:600 13px "Chakra Petch",sans-serif}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#f8e3a0,#c9992f 55%,#e8c464);color:#1a1204;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);min-height:0}
body.nopanel .main{grid-template-columns:minmax(0,1fr)}
body.nopanel .panel{display:none}
.stage{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;padding:12px max(12px,1.5vw);background:radial-gradient(ellipse at 50% 0%,rgba(42,82,180,.28),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(217,178,76,.10),transparent 50%),url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27520%27%20height%3D%27520%27%3E%3Cg%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%3E%3Cg%20stroke%3D%27%233d7bd9%27%20stroke-opacity%3D%27.30%27%20stroke-width%3D%271.4%27%3E%3Cpath%20d%3D%27M0%2070H140L170%20100H330L360%2070H520%27/%3E%3Cpath%20d%3D%27M0%20300H90L120%20330H250L280%20300H520%27/%3E%3Cpath%20d%3D%27M70%200V120L100%20150V260L70%20290V520%27/%3E%3Cpath%20d%3D%27M400%200V160L370%20190V340L400%20370V520%27/%3E%3Cpath%20d%3D%27M200%20520V430L230%20400H330L360%20430V520%27/%3E%3Cpath%20d%3D%27M460%20100V240L490%20270H520%27/%3E%3C/g%3E%3Cg%20stroke%3D%27%23d9b24c%27%20stroke-opacity%3D%27.26%27%20stroke-width%3D%271.2%27%3E%3Cpath%20d%3D%27M0%20190H40L60%20210H200L220%20190H300%27/%3E%3Cpath%20d%3D%27M260%200V40L240%2060V160%27/%3E%3Cpath%20d%3D%27M520%20450H440L420%20470H300%27/%3E%3Cpath%20d%3D%27M150%20520V470L130%20450V380%27/%3E%3C/g%3E%3Cg%20stroke%3D%27%233d7bd9%27%20stroke-opacity%3D%27.18%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M0%20250H30M0%20256H24M0%20262H30%27/%3E%3Cpath%20d%3D%27M310%20160H360M310%20166H352M310%20172H360%27/%3E%3C/g%3E%3C/g%3E%3Cg%20fill%3D%27%23d9b24c%27%20fill-opacity%3D%27.55%27%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2770%27%20r%3D%273%27/%3E%3Ccircle%20cx%3D%27360%27%20cy%3D%2770%27%20r%3D%273%27/%3E%3Ccircle%20cx%3D%27300%27%20cy%3D%27190%27%20r%3D%273%27/%3E%3Ccircle%20cx%3D%27240%27%20cy%3D%27160%27%20r%3D%273%27/%3E%3Ccircle%20cx%3D%27300%27%20cy%3D%27470%27%20r%3D%273%27/%3E%3Ccircle%20cx%3D%27130%27%20cy%3D%27380%27%20r%3D%273%27/%3E%3C/g%3E%3Cg%20fill%3D%27%234ea3ff%27%20fill-opacity%3D%27.6%27%3E%3Ccircle%20cx%3D%2770%27%20cy%3D%27120%27%20r%3D%272.5%27/%3E%3Ccircle%20cx%3D%27400%27%20cy%3D%27160%27%20r%3D%272.5%27/%3E%3Ccircle%20cx%3D%27250%27%20cy%3D%27330%27%20r%3D%272.5%27/%3E%3Ccircle%20cx%3D%27330%27%20cy%3D%27400%27%20r%3D%272.5%27/%3E%3Ccircle%20cx%3D%27460%27%20cy%3D%27100%27%20r%3D%272.5%27/%3E%3C/g%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%233d7bd9%27%20stroke-opacity%3D%27.35%27%3E%3Crect%20x%3D%27300%27%20y%3D%27250%27%20width%3D%2760%27%20height%3D%2734%27%20rx%3D%273%27/%3E%3Crect%20x%3D%2720%27%20y%3D%27400%27%20width%3D%2744%27%20height%3D%2726%27%20rx%3D%273%27/%3E%3C/g%3E%3C/svg%3E") 0 0/520px 520px,linear-gradient(rgba(120,150,220,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(120,150,220,.05) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}
.stage::before,.stage::after{content:'';position:absolute;width:46px;height:46px;border:2px solid rgba(217,178,76,.75);pointer-events:none}
.stage::before{left:8px;top:8px;border-right:0;border-bottom:0}
.stage::after{right:8px;bottom:8px;border-left:0;border-top:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs:empty{display:none}
.tabs button{border:1px solid var(--line);background:#0a1532;color:var(--muted);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font:600 13px "Chakra Petch","IBM Plex Sans Thai",sans-serif}
.tabs button[aria-pressed=true]{background:linear-gradient(180deg,#f8e3a0,#c9992f 55%,#e8c464);color:#1a1204;border-color:#f4d98a}
.dia{min-height:0;overflow:auto}
.dia svg{display:block;width:100%;height:auto;max-width:calc(66.667vw - 3vw - 4px);margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);padding-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{display:inline-block;width:26px;height:0;border-top:2.5px solid}
.panel{border-left:1px solid var(--line);overflow:auto;padding:18px 22px 40px;background:linear-gradient(180deg,#0b1736,#070f24)}
.panel h2{font:700 22px/1.25 "Chakra Petch","IBM Plex Sans Thai",sans-serif;margin:0 0 10px;color:var(--gold2)}
.panel h3{font:600 16px "Chakra Petch","IBM Plex Sans Thai",sans-serif;margin:20px 0 6px;color:#cfdcf7}
.panel p{margin:0 0 10px}
.panel ol,.panel ul{margin:0 0 10px;padding-left:22px}
.panel li{margin-bottom:6px}
.panel b{color:#fff}
.panel .hint{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:18px}
.back{display:inline-block;margin-bottom:10px;color:var(--gold2);cursor:pointer;font-size:14px;background:none;border:0;padding:4px 0}
.note{display:block;font-size:13px;color:#ffe7a6;background:rgba(217,178,76,.1);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0 0 10px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));gap:6px;margin:10px 0}
.chips div{background:linear-gradient(180deg,#16264c,#0c1834);border:1px solid rgba(143,163,199,.25);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted)}
.chips b{display:block;font:700 17px "Chakra Petch",sans-serif;color:var(--gold2);white-space:nowrap}
.pc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:8px 0}
.pc div{border-radius:10px;padding:10px 12px;font-size:14px}
.pc ul{padding-left:18px;margin:4px 0 0}
.pc .p{background:linear-gradient(180deg,rgba(63,224,176,.16),rgba(63,224,176,.05));border:1px solid rgba(63,224,176,.3)}
.pc .c{background:linear-gradient(180deg,rgba(255,122,69,.16),rgba(255,122,69,.05));border:1px solid rgba(255,122,69,.3)}
.pc h4{margin:0;font:600 14px "Chakra Petch","IBM Plex Sans Thai",sans-serif}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.t th,table.t td{border-bottom:1px solid rgba(143,163,199,.2);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{font:600 13px "Chakra Petch","IBM Plex Sans Thai",sans-serif;color:var(--gold2)}
.star{color:var(--gold2);letter-spacing:1px;white-space:nowrap}
.cmpwrap{overflow:auto;height:100%}
.cmpcard{background:linear-gradient(180deg,rgba(22,38,76,.85),rgba(10,20,46,.9));border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(244,217,138,.15)}
.cmpcard h2{font:700 clamp(18px,2vw,24px)/1.2 "Chakra Petch","IBM Plex Sans Thai",sans-serif;margin:0 0 4px;color:var(--gold2)}
.cmpcard p.sub{color:var(--muted);margin:0 0 10px;font-size:14px}
.cmpcard table.t td:first-child{color:#cfdcf7;font-weight:500;width:24%}
.cmpcard table.t td{font-size:15px}
svg text{font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
.n rect.b{stroke-width:1.2;stroke-opacity:.9}
.n rect.s{fill:url(#sheen);pointer-events:none}
.n .t1{font:600 17px "Chakra Petch","IBM Plex Sans Thai",sans-serif;fill:#fff}
.n .t2{font-size:15px;fill:#f2f5fb}
.n text{paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px;stroke-linejoin:round}
.hit{cursor:pointer}
.hit:hover rect.b{stroke-width:2.6;filter:drop-shadow(0 0 6px rgba(244,217,138,.55))}
.hit:focus{outline:none}
.hit:focus-visible rect.b,.hit.sel rect.b{stroke:#f4d98a;stroke-width:3;filter:drop-shadow(0 0 8px rgba(244,217,138,.75))}
.cont{fill:rgba(10,20,46,.35);stroke-width:1.3;stroke-dasharray:7 5}
.cl{font:600 16px "Chakra Petch","IBM Plex Sans Thai",sans-serif}
.lbl{font-size:15px;font-weight:500;fill:#b9c8e6;paint-order:stroke;stroke:#050b1a;stroke-width:4px}
.ln{fill:none;stroke-width:2.2}
@media(max-width:760px){
.strip img{height:40px}
.bar{flex-wrap:wrap}
.nav{order:2;width:100%;flex:none}
.seg{order:1;margin-left:auto}
.main{grid-template-columns:minmax(0,1fr)}
.stage{padding-bottom:calc(42vh + 12px)}
body.nopanel .stage{padding-bottom:12px}
.dia svg{min-width:780px;max-width:none;height:auto}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:42vh;border-left:0;border-top:1px solid var(--gold);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.6);z-index:5;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.pc{grid-template-columns:minmax(0,1fr)}
.cmpcard table.t td{font-size:14px}
}
@media(prefers-reduced-motion:no-preference){.flow{animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}}
</style>
</head>

const B=(x,y,w,h,k,t1,t2,o={})=>{const a=o.go?` data-go="${o.go}"`:'',b=o.i?` data-i="${o.i}"`:'',hit=o.go||o.i;const cy=y+h/2;const lines=t2?(Array.isArray(t2)?t2:[t2]):[];const top=cy-lines.length*10.5;return `<g class="n${hit?' hit':''}"${a}${b}${hit?` tabindex="0" role="button" aria-label="${t1}"`:''}><rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="url(#g-${k})" stroke="${STK[k]}"/><rect class="s" x="${x+1}" y="${y+1}" width="${w-2}" height="${h-2}" rx="8"/><text class="t1" x="${x+w/2}" y="${top}" text-anchor="middle" dominant-baseline="central">${t1}</text>${lines.map((l,i)=>`<text class="t2" x="${x+w/2}" y="${top+22+i*20}" text-anchor="middle" dominant-baseline="central">${l}</text>`).join('')}</g>`};

}

[660,750,840].forEach(x=>s+=L('air',`M${x} 498 L${x} 540`));

text:()=>doas()?`<h2>ภาพรวม: ระบบ DOAS</h2>
<p><b>DOAS (Dedicated Outdoor Air System)</b> รับเฉพาะอากาศภายนอก (~1,100 m³/h สำหรับ 2 ห้อง) มารีดความชื้นจนแห้งจัด แล้วส่งให้ AHU ของแต่ละห้อง ลมกลับจากห้องไม่ต้องเข้า DOAS เพราะแห้งอยู่แล้ว</p>
<h3>ลำดับใน DOAS</h3>
<ol><li><b>Heat pipe ฝั่ง pre-cool:</b> ลดอุณหภูมิอากาศภายนอกจาก <b>33°C</b> เหลือประมาณ <b>27°C</b></li><li><b>คอยล์น้ำชิล:</b> ทำเย็นต่อเหลือประมาณ <b>14°C</b> และเริ่มรีดความชื้น</li><li><b>คอยล์ DX:</b> ย้ายมาอยู่ที่ DOAS ทำเย็นถึงประมาณ <b>5°C</b> รีดความชื้นจนจุดน้ำค้างเหลือ 4–5°C</li><li><b>Heat pipe ฝั่ง reheat:</b> อุ่นลมกลับเป็นประมาณ <b>11°C</b> กันไม่ให้ท่อลมมีน้ำเกาะ</li></ol>
<p><b>Heat pipe</b> คือท่อปิดสนิทที่มีสารทำความเย็นอยู่ข้างใน ทำงานเองตลอดเวลาโดยไม่ใช้ไฟ อาศัยความต่างของแรงดันในท่อกับแรงโน้มถ่วง จึงติดตั้งให้ฝั่ง reheat สูงกว่าฝั่ง pre-cool เล็กน้อย</p>
<h3>ใน AHU ของแต่ละห้อง</h3>
<ol><li>ลมเย็นและแห้งจาก DOAS ผสมกับลมกลับ (18°C) ได้ประมาณ <b>16°C</b></li><li>ผ่าน<b>คอยล์น้ำชิลแบบคอยล์แห้ง (dry coil)</b> ซึ่งทำความเย็นอย่างเดียวเพื่อคุมอุณหภูมิห้อง ผิวคอยล์ต้องอุ่นกว่าจุดน้ำค้างของลมผสม จะได้ไม่มีน้ำควบแน่น</li><li><b>Heater ตัวเล็ก (1–3 kW)</b> ใช้ปรับอุณหภูมิละเอียดเท่านั้น</li><li>ลมที่ส่งเข้าแผง laminar อยู่ประมาณ <b>15–17°C</b></li></ol>
<h3>เป้าหมายห้องผ่าตัด</h3>${chips([['18°C','อุณหภูมิ'],['40–50%','ความชื้น'],['25–35','ACH'],['≤ 55','dB(A)'],['+10–15 Pa','แรงดันบวก']])}
<p class="hint">คลิกกล่องในแผนภูมิ หรือเลือกจากเมนูด้านบน เพื่อดูรายละเอียดแต่ละระบบ · ตัวเลขคิดจากห้องสมมติ 6×6×3 ม.</p>`:`<h2>ภาพรวม: ระบบ Cool–Reheat</h2>
<ol><li><b>อากาศภายนอก</b> (~33°C ชื้น) เข้า AHU แล้วผสมกับ<b>ลมกลับจากห้อง</b> (18°C) อุณหภูมิลมผสมลดลงเหลือประมาณ <b>20°C</b></li>
<li><b>คอยล์น้ำชิล (คอยล์เปียก):</b> น้ำชิล 7°C ดึงความร้อนออกจากลม ลมเย็นลงเหลือประมาณ <b>12–13°C</b> ไอน้ำในอากาศควบแน่นเป็นหยดน้ำ อากาศจึงแห้งลง</li>
<li><b>คอยล์ DX (Direct Expansion):</b> ลมยังชื้นเกินเป้า และน้ำชิลทำความเย็นได้แค่นี้ จึงต้องเพิ่มคอยล์ DX ซึ่งใช้น้ำยาแอร์ทำความเย็นให้ลมโดยตรง ลมเย็นลงถึงประมาณ <b>6°C</b> และรีดความชื้นออกได้อีก<br>น้ำยามาจาก<b>คอนเดนซิ่งยูนิต</b>ที่ตั้งภายนอกอาคาร น้ำยาเย็น <b>~2–5°C</b> ไหลเข้าคอยล์ ไอน้ำยา <b>~10°C</b> ไหลกลับไปที่คอนเดนซิ่งยูนิต ซึ่งระบายความร้อนทิ้งสู่อากาศภายนอก</li>
<li><b>Reheat (Heater / Hot gas / Heat pump):</b> ลมที่ 6°C เย็นเกินไปสำหรับห้อง จึงต้องอุ่นกลับเป็นประมาณ <b>15°C</b> ใช้ความร้อนประมาณ <b>10 kW ต่อห้อง</b></li>
<li><b>พัดลม → แผง Laminar:</b> ส่งลมประมาณ 15°C ลงคลุมเตียง ห้องได้ <b>18°C ความชื้น 40–50%</b></li></ol>
<h3>เป้าหมายห้องผ่าตัด</h3>${chips([['18°C','อุณหภูมิ'],['40–50%','ความชื้น'],['25–35','ACH'],['≤ 55','dB(A)'],['+10–15 Pa','แรงดันบวก']])}
<p class="hint">คลิกกล่องในแผนภูมิ หรือเลือกจากเมนูด้านบน เพื่อดูรายละเอียดแต่ละระบบ · ตัวเลขคิดจากห้องสมมติ 6×6×3 ม.</p>`,
items:{filter:FILTER}};

s+=B(680,240,180,60,'chw','ปั๊มน้ำเย็น',['ดันน้ำวนทั้งระบบ'],{i:'chwp'});

return svg(900,570,s,'แผนภูมิระบบน้ำชิล')},
text:()=>`<h2>ระบบน้ำชิล: 3 วงจรที่ทำงานต่อกัน</h2>
<h3>วงจรที่ 1: น้ำเย็น (สีฟ้า)</h3>
<p>ชิลเลอร์ทำน้ำให้เย็นถึง <b>7°C</b> ส่งออกทางท่อเมนจ่าย ผ่านชุดวาล์วและท่อแยก ไปรับความร้อนจากลมที่คอยล์ของ AHU, FCU และ DOAS น้ำจึงอุ่นขึ้นเป็น <b>12°C</b> จากนั้นปั๊มน้ำเย็นดันน้ำนี้กลับเข้าชิลเลอร์เพื่อทำให้เย็นอีกครั้ง</p>
<h3>วงจรที่ 2: น้ำยาแอร์ในชิลเลอร์ (สีชมพู)</h3>
<ol><li>น้ำยาเหลวความดันสูงไหลผ่าน<b>วาล์วลดความดัน (Expansion Valve)</b> อุณหภูมิลดลงเหลือประมาณ <b>3–5°C</b></li><li>เข้า <b>Evaporator</b> ของชิลเลอร์ ดึงความร้อนออกจากน้ำชิล (12 → 7°C) น้ำยาระเหยเป็นไอความดันต่ำ</li><li><b>Compressor</b> ดูดไอน้ำยาไปอัด ความดันและอุณหภูมิสูงขึ้น</li><li><b>Condenser</b> ระบายความร้อนออกจากน้ำยาให้กับน้ำระบายความร้อน (วงจรที่ 3) น้ำยาควบแน่นกลับเป็นของเหลวที่ประมาณ <b>38–40°C</b> แล้ววนกลับไปที่วาล์วลดความดัน</li></ol>
<h3>วงจรที่ 3: น้ำระบายความร้อน (สีน้ำตาล)</h3>

text:()=>`<h2>ท่อและชุดวาล์ว</h2>
<ol><li><b>น้ำชิล 7°C</b> จากท่อเมนจ่ายไหลผ่าน<b>บอลวาล์ว</b> (ช่างมักเรียกว่าวาล์วเมน) ซึ่งปกติเปิดค้างไว้ ปิดเฉพาะตอนซ่อม</li>
<li>ผ่าน <b>Strainer</b> กรองเศษและสิ่งสกปรก ก่อนเข้า<b>คอยล์เย็น</b>ใน AHU หรือ FCU เพื่อดึงความร้อนออกจากลมที่จะส่งเข้าห้อง</li>
<li>น้ำที่อุ่นขึ้นเป็น <b>12°C</b> ไหลออกจากคอยล์ ผ่าน<b>มอเตอร์วาล์ว</b> ซึ่งเปิด-ปิดหรือหรี่น้ำอัตโนมัติตามคำสั่งจากเทอร์โมสตัท<br>ถ้ามอเตอร์วาล์วค้างอยู่ที่ตำแหน่งเปิด น้ำเย็นจะไหลตลอดเวลาแม้ปิดเครื่องแล้ว ห้องจะเย็นเกิน และท่อกับตัวเครื่องจะเย็นจนน้ำเกาะแล้วหยดลงฝ้า</li>
<li>ผ่าน <b>Balancing valve</b> ซึ่งตั้งปริมาณน้ำให้เครื่องแต่ละตัวได้ตามที่ออกแบบ ตั้งครั้งเดียวแล้วล็อกไว้ แล้วผ่านบอลวาล์วฝั่งขาออก กลับเข้าท่อเมนกลับ</li></ol>
<h3>ทำไมมอเตอร์วาล์วนิยมติดหลังคอยล์</h3>
<p>มอเตอร์วาล์วติดก่อนหรือหลังคอยล์ก็คุมน้ำได้เหมือนกัน แต่นิยมติดหลังคอยล์ เพราะ</p>
<ul><li>น้ำที่ผ่านวาล์วอุ่นกว่า (12°C) ตัววาล์วจึงเกิดหยดน้ำน้อยกว่า ลดโอกาสที่น้ำจะหยดลงหัวมอเตอร์ ซึ่งหุ้มฉนวนไม่ได้เพราะต้องระบายความร้อน</li><li>ติดเป็นชุดเดียวกับ balancing valve ได้สะดวก หรือจะใช้ <b>PICV</b> ที่รวมสองหน้าที่ไว้ในตัวเดียวก็ได้</li></ul>${HINT}`,

text:()=>{const d=doas();return `<h2>AHU: ${d?'ระบบ DOAS':'ระบบ Cool–Reheat'}</h2>
${d?'<ol><li><b>ลมแห้งจาก DOAS (~11°C)</b> ผสมกับ<b>ลมกลับจากห้อง (18°C)</b> ได้ลมผสมประมาณ <b>16°C</b></li><li>ผ่าน<b>กรอง F9</b></li><li><b>คอยล์น้ำชิลแบบคอยล์แห้ง (dry coil):</b> ลดอุณหภูมิลมลงเท่าที่ห้องต้องการ ช่วงผ่าตัดที่ภาระสูงอยู่ราว <b>15°C</b> ไม่มีน้ำควบแน่น เพราะผิวคอยล์อุ่นกว่าจุดน้ำค้างของลมผสม</li><li><b>Heater ตัวเล็ก (1–3 kW):</b> ปรับอุณหภูมิละเอียด ทำงานเฉพาะช่วงที่ห้องต้องการลมอุ่นกว่าลมผสม เช่น ตอนห้องว่าง</li><li><b>พัดลม</b> ส่งลมเข้าแผง Laminar ที่ประมาณ <b>15–17°C</b></li></ol>':'<ol><li><b>อากาศภายนอก (~33°C)</b> ผสมกับ<b>ลมกลับจากห้อง (18°C)</b> ได้ลมผสมประมาณ <b>20°C</b></li><li>ผ่าน<b>กรอง F9</b></li><li><b>คอยล์น้ำชิล (คอยล์เปียก):</b> น้ำชิล 7°C ทำให้ลมเย็นลงเหลือประมาณ <b>12–13°C</b> ไอน้ำควบแน่นเป็นหยดน้ำลงถาดน้ำทิ้ง</li><li><b>คอยล์ DX:</b> ใช้น้ำยาแอร์จากคอนเดนซิ่งยูนิตภายนอก ทำให้ลมเย็นลงอีกถึงประมาณ <b>6°C</b> เพื่อรีดความชื้นออกให้ถึงเกณฑ์</li><li><b>Reheat (~10 kW):</b> อุ่นลมกลับเป็นประมาณ <b>15°C</b></li><li><b>พัดลม</b> ส่งลมเข้าแผง Laminar</li></ol>'}
<h3>การควบคุม</h3>
<ul><li>เทอร์โมสตัทหรือ DDC วัดอุณหภูมิและความชื้น คำนวณความต้องการเย็นจากทั้งสองค่า แล้วเลือกค่าที่มากกว่า (high select) ไปสั่งคอยล์</li><li>ถ้าความชื้นเกินค่าตั้ง คอยล์จะทำลมให้เย็นถึงจุดน้ำค้าง แล้ว reheat อุ่นกลับตามอุณหภูมิห้อง</li><li>ปริมาณลมคงที่ 25–35 ACH เพื่อรักษาความสะอาด จึงต้องปรับที่อุณหภูมิลมแทนการลดปริมาณลม</li></ul>${HINT}`},
items:{
mix:['ผสมลม','<p>จุดที่ลม 2 สายมาเจอกัน คือลมใหม่ (จาก DOAS หรืออากาศภายนอก) กับลมกลับจากห้อง สัดส่วนลมใหม่ประมาณ 4–6 ACH ส่วนที่เหลือเป็นลมกลับ ลมใหม่ที่จ่ายเข้าห้องยังเป็นตัวรักษาแรงดันบวกของห้องด้วย</p>'],

text:()=>{const d=doas();const ctx=d?'<span class="note">ระบบ DOAS: Reheat เหลือแค่ heater ตัวเล็ก 1–3 kW ไว้ปรับอุณหภูมิละเอียด แบบ heater จึงคุ้มที่สุด</span>':'<span class="note">ระบบ Cool–Reheat: Reheat ต้องอุ่นลมจาก ~6°C เป็น ~15°C ใช้ความร้อนประมาณ 10 kW ต่อห้องตลอด 24 ชม. การเลือกแบบจึงมีผลกับค่าไฟมาก</span>';
if(S.tab==='heater')return `<h2>Heater ไฟฟ้า</h2>${ctx}
<ol><li>ลมเย็นจากคอยล์ (~6°C ในระบบ Cool–Reheat หรือ ~16°C ในระบบ DOAS) ไหลผ่าน<b>ขดลวดไฟฟ้า</b> ซึ่งแปลงไฟเป็นความร้อนแล้วอุ่นลม</li><li><b>เซนเซอร์</b>วัดอุณหภูมิลมจ่ายหรือห้อง แล้วส่งค่าให้ <b>DDC</b> เทียบกับค่าที่ตั้งไว้</li><li>DDC ส่งสัญญาณไปที่ <b>SCR</b> ซึ่งหรี่กำลังไฟเข้าขดลวดได้ละเอียด 0–100%</li><li>ลมที่อุ่นแล้ว (~15°C) ผ่านพัดลมเข้าแผง Laminar</li></ol>
<h3>ระบบความปลอดภัย (Interlock)</h3><p>ต้องผ่านครบทั้ง 3 ข้อจึงจ่ายไฟได้</p>
<ul><li><b>Airflow switch:</b> ต้องมีลมไหลผ่าน</li><li><b>High-limit:</b> ตัดไฟเมื่อร้อนเกิน</li><li><b>Fan interlock:</b> พัดลมต้องเดินก่อน heater และเดินต่ออีกสักพักหลังปิด heater เพื่อระบายความร้อนค้าง</li></ul>
<p><b>ติดตั้ง:</b> ใส่ในกล่อง reheat ของ AHU ได้เลย เพิ่มแค่สายไฟ 3 เฟส ตู้ SCR และอุปกรณ์ความปลอดภัย</p>
${chips([['±0.2–0.5°C','ความแม่นยำ'],['COP 1','ไฟ 1 kW ได้ร้อน 1 kW'],['30–80k','บาท ต่อ AHU'],[d?'ต่ำ':'~380k','บาท/ปี ต่อห้อง']])}
${pc(['ลงทุนถูกที่สุด ติดตั้งง่าย','แม่นยำที่สุด ตอบสนองทันที','ไม่ผูกกับระบบอื่น ใช้ได้ทั้งน้ำชิลและ DX','ดูแลง่าย ช่างไฟทั่วไปทำได้'],['ค่าไฟสูงที่สุดถ้าใช้เป็นตัวหลัก','เพิ่มภาระหม้อแปลงและไฟสำรอง (~10 kW ต่อห้อง ≈ 15–17 A 3 เฟส)','ต้องมีระบบกันร้อนเกินหลายชั้น'])}${HINT}`;
if(S.tab==='hotgas')return `<h2>Hot gas reheat</h2>${ctx}
<ol><li><b>คอยล์ DX:</b> น้ำยาเย็น (~2–5°C) รับความร้อนจากลม ลมเย็นลงถึง ~6°C ส่วนน้ำยากลายเป็นไอที่ยังเย็นอยู่</li><li><b>คอมเพรสเซอร์:</b> อัดไอน้ำยาให้เป็นแก๊สร้อน <b>~60–80°C</b> ความร้อนที่ใช้ reheat มาจากขั้นนี้</li><li><b>วาล์ว 3 ทาง:</b> แบ่งแก๊สร้อนตามที่ห้องต้องการ<ul><li>ส่วนหนึ่งไป<b>คอยล์ reheat</b> ใน AHU อุ่นลมจาก ~6°C เป็น ~15°C แล้วกลายเป็นของเหลว</li><li>ส่วนที่เหลือไป <b>Condenser</b> ระบายทิ้งนอกอาคาร</li></ul></li><li>ของเหลวจากทั้งสองทางรวมกัน ผ่าน<b>วาล์วลดความดัน</b> แล้วกลับเข้าคอยล์ DX</li></ol>
<p><b>ติดตั้ง:</b> ใช้คอนเดนซิ่งยูนิตตัวเดียวกับคอยล์ DX แต่ต้องเดินท่อน้ำยาเพิ่ม 2 เส้น คือท่อแก๊สร้อนไปคอยล์ reheat และท่อของเหลวกลับ</p>
${chips([['±0.5–2°C','ความแม่นยำ'],['แทบฟรี','ค่าไฟ reheat'],['150–400k','บาท ต่อ AHU']])}
${pc(['ค่าไฟ reheat ต่ำที่สุด ใช้ความร้อนทิ้ง','ลดภาระ condenser','ไม่ต้องมีระบบน้ำร้อน'],['ลงทุนสูง ท่อน้ำยาซับซ้อน','ใช้ได้เฉพาะระบบที่มี DX','ความร้อนผูกกับคอมเพรสเซอร์ คอมเพรสเซอร์ตัด ความร้อนก็หาย','ปรับ reheat แล้วกระทบความเย็นของคอยล์ DX ด้วย','ต้องใช้ช่างระบบน้ำยาที่ชำนาญ'])}${HINT}`;
return `<h2>Heat pump reheat</h2>${ctx}
<p>ระบบนี้มี 2 วงจรแยกกัน และส่งความร้อนต่อกันที่<b>ตัวถ่ายร้อน</b></p>
<h3>วงจรน้ำยา (อยู่ในตัวฮีทปั๊มเท่านั้น)</h3>
<ol><li><b>คอยล์นอก:</b> น้ำยาเย็นจัดดูดความร้อนจากอากาศภายนอก (~33°C) แล้วระเหยเป็นไอ</li><li><b>คอมเพรสเซอร์:</b> อัดไอน้ำยาให้ร้อนจัด</li><li><b>ตัวถ่ายร้อน:</b> น้ำยาถ่ายความร้อนให้น้ำ แล้วควบแน่นเป็นของเหลว</li><li><b>วาล์วลดความดัน:</b> น้ำยาเย็นลง แล้วกลับไปที่คอยล์นอก</li></ol>
<p>หลักการเดียวกับแอร์บ้าน แต่ใช้งานฝั่งร้อนแทนฝั่งเย็น</p>
<h3>วงจรน้ำร้อน</h3>
<ol><li>น้ำร้อน <b>45–55°C</b> เก็บในถังพัก</li><li>ปั๊มส่งน้ำร้อนไปที่<b>คอยล์น้ำร้อน</b>ใน AHU อุ่นลมจาก ~6°C เป็น ~15°C</li><li><b>วาล์วน้ำร้อนแบบหรี่</b>ปรับปริมาณน้ำตามคำสั่งจาก DDC</li><li>น้ำกลับ (~40°C) ไหลกลับไปรับความร้อนที่ตัวถ่ายร้อนอีกรอบ</li></ol>

scr:['SCR: Silicon Controlled Rectifier (ไทริสเตอร์)','<p>อุปกรณ์อิเล็กทรอนิกส์กำลังที่ทำหน้าที่เป็น<b>สวิตช์ไฟความเร็วสูง</b> เปิด-ปิดไฟเข้าขดลวด heater หลายครั้งต่อวินาที เพื่อหรี่กำลังได้ละเอียด 0–100% ตามสัญญาณ 0–10V จาก DDC ไม่มีหน้าสัมผัสที่สึกหรอแบบคอนแทคเตอร์ จึงคุมอุณหภูมิได้แม่นยำและอายุใช้งานยาว</p>'],
ddc:['DDC และ PID','<p><b>DDC: Direct Digital Control (ระบบควบคุมแบบดิจิทัลโดยตรง)</b><br>กล่องคอมพิวเตอร์ควบคุมของงานระบบ รับค่าจากเซนเซอร์ (อุณหภูมิ ความชื้น แรงดัน) แล้วสั่งอุปกรณ์ เช่น มอเตอร์วาล์ว heater และพัดลม ตามโปรแกรมที่ตั้งไว้ มักต่อเข้าระบบ BMS (Building Management System) ให้ดูและสั่งงานจากห้องควบคุมได้</p><p><b>PID: Proportional–Integral–Derivative (การควบคุมแบบสัดส่วน–ปริพันธ์–อนุพันธ์)</b><br>วิธีคำนวณที่ DDC ใช้ตัดสินว่าต้องสั่งอุปกรณ์แรงแค่ไหน จากส่วนต่างระหว่างค่าที่วัดได้กับค่าที่ตั้งไว้</p><ul><li><b>P (สัดส่วน):</b> ห่างจากค่าตั้งมาก ก็สั่งแรงมาก</li><li><b>I (ปริพันธ์):</b> ถ้าค้างห่างจากค่าตั้งอยู่นาน ก็ค่อยๆ เพิ่มแรงจนเข้าเป้าพอดี</li><li><b>D (อนุพันธ์):</b> ถ้าค่าเปลี่ยนเร็ว ก็ผ่อนแรงไว้ก่อน กันไม่ให้เลยเป้า</li></ul><p>เปรียบเหมือนคนขับรถที่ค่อยๆ ผ่อนคันเร่งเมื่อใกล้ถึงความเร็วที่ต้องการ อุณหภูมิจึงนิ่ง ไม่แกว่ง</p><p><b>ทำงานต่อกัน:</b> เซนเซอร์วัดอุณหภูมิ → DDC ใช้สูตร PID คำนวณว่าต้องเติมความร้อนเท่าไร → ส่งสัญญาณไปที่ SCR → SCR หรี่ไฟเข้าขดลวด heater</p>'],

text:()=>`<h2>DOAS (Dedicated Outdoor Air System)</h2>
${doas()?'':'<span class="note">ใช้เฉพาะระบบ DOAS · ตอนนี้เลือก Cool–Reheat อยู่</span>'}
<p>DOAS รับเฉพาะอากาศภายนอก (~1,100 m³/h สำหรับ 2 ห้อง) มารีดความชื้นจนแห้งจัด แล้วส่งให้ AHU ของแต่ละห้อง ลมกลับจากห้องไม่ต้องเข้า DOAS เพราะแห้งอยู่แล้ว</p>
<h3>ลำดับการทำงาน</h3>
<ol><li><b>อากาศภายนอก (~33°C ชื้น)</b> ผ่าน<b>กรอง G4 + F7</b> ดักฝุ่นก่อนเข้าคอยล์</li>
<li><b>Heat pipe ฝั่ง pre-cool:</b> สารทำความเย็นในท่อดูดความร้อนจากอากาศจนระเหยเป็นไอ อากาศเย็นลงเหลือประมาณ <b>27°C</b> ไอในฝั่งนี้มีแรงดันสูง จึงไหลไปตามท่อสู่ฝั่ง reheat เอง โดยไม่ต้องใช้ปั๊มหรือคอมเพรสเซอร์</li>
<li><b>คอยล์น้ำชิล (คอยล์เปียก):</b> น้ำชิล 7°C ทำให้ลมเย็นลงเหลือประมาณ <b>14°C</b> และเริ่มรีดความชื้น</li>
<li><b>คอยล์ DX:</b> ใช้น้ำยาแอร์จากคอนเดนซิ่งยูนิตภายนอก ทำให้ลมเย็นลงถึงประมาณ <b>5°C</b> จุดน้ำค้างเหลือ 4–5°C ซึ่งต่ำกว่าจุดน้ำค้างของห้อง (~6°C) ลมจึงยังดูดซับความชื้นจากคนในห้องได้</li>
<li><b>Heat pipe ฝั่ง reheat:</b> ไอสารที่ไหลมาจากฝั่ง pre-cool เจอลมเย็นจัด จึงควบแน่นเป็นของเหลวและคายความร้อนให้ลม ลมอุ่นขึ้นเป็นประมาณ <b>11°C</b> ช่วยกันไม่ให้ท่อลมที่วิ่งไป AHU มีน้ำเกาะ<br>ของเหลวที่ควบแน่นไหลกลับไปฝั่ง pre-cool ด้วย<b>แรงโน้มถ่วง</b> เพราะติดตั้งให้ฝั่ง reheat สูงกว่าเล็กน้อย แล้วระเหยรอบใหม่ วนแบบนี้ตลอดเวลาโดยไม่ใช้ไฟ</li>
<li><b>พัดลม</b> ส่งลมแห้งไปผสมลมใน AHU ทั้ง 2 ห้อง</li></ol>
<p><b>สรุปผลของ heat pipe:</b> ความร้อนที่ดึงออกจากอากาศภายนอกในขั้นที่ 2 (ลดลง ~6°C) คือความร้อนเดียวกับที่ใช้อุ่นลมในขั้นที่ 5 (เพิ่มขึ้น ~6°C) จึงได้ทั้งการลดภาระคอยล์และการ reheat ฟรี เหมือนหม้อต้มน้ำปิดฝา ที่ไอลอยขึ้นไปควบแน่นที่ฝาแล้วหยดกลับลงมา</p>
<h3>ข้อดีข้อเสียของ DOAS</h3>
${pc(['คุมความชื้น 40–50% ได้เสถียร คุมจุดเดียว','reheat ใน AHU เหลือ 1–3 kW ประหยัดไฟมาก','AHU ใช้คอยล์แห้งกับน้ำชิลเดิมได้ เสียงเบาลง','ฮีทไปป์ให้ทั้ง pre-cool และ reheat ฟรี'],['ลงทุนเพิ่มอีก 1 เครื่อง พร้อมพื้นที่และท่อลม','DOAS เสีย ความชื้นทั้ง 2 ห้องขึ้นพร้อมกัน','ลมออกจากคอยล์เย็นจัด ท่อลมต้องหุ้มฉนวนดี','ออกแบบและปรับตั้งซับซ้อนกว่า'])}${HINT}`,
items:{

hp1:['Heat pipe ฝั่ง pre-cool','<p>อยู่ในอากาศภายนอกที่เพิ่งเข้ามา สารในท่อดูดความร้อนแล้วระเหยเป็นไอ อากาศเย็นลงก่อนถึงคอยล์ ลดภาระคอยล์น้ำชิลและ DX ไอที่เกิดขึ้นมีแรงดันสูงกว่าฝั่ง reheat จึงไหลไปเอง</p><p>ฝั่งนี้ต้องอยู่ต่ำกว่าฝั่ง reheat เล็กน้อย ของเหลวที่ไหลกลับมาจะได้ลงมารวมที่ฝั่งนี้</p>'],
chwc:['คอยล์น้ำชิล (ใน DOAS)','<p>รับน้ำชิล 7°C จากระบบน้ำชิลเดียวกับทั้งอาคาร ทำเย็นขั้นหลักและรีดความชื้นได้บางส่วน เป็นคอยล์เปียก ต้องมีถาดน้ำทิ้ง ท่อแยกเข้าคอยล์นี้มีชุดวาล์วแบบเดียวกับ AHU</p>'],
dxc:['คอยล์ DX (ใน DOAS)','<p>ใช้น้ำยาแอร์จากคอนเดนซิ่งยูนิต ไม่ได้ใช้น้ำชิล ทำลมให้เย็นถึง ~5°C เพื่อให้จุดน้ำค้างต่ำกว่าของห้อง (~6°C) จึงดูดซับความชื้นจากคนในห้องได้</p>'],
hp2:['Heat pipe ฝั่ง reheat','<p>อยู่ในลมเย็นจัดที่ออกจากคอยล์ DX ไอสารควบแน่นแล้วคายความร้อน อุ่นลมเป็น ~11°C ลดความเสี่ยงที่ท่อลมไปยัง AHU จะมีน้ำเกาะ โดยไม่ใช้ไฟ</p><p>ถ้าติดตั้งเอียงผิดทาง ของเหลวจะค้างอยู่ฝั่งนี้ และ heat pipe จะทำงานได้น้อยหรือไม่ทำงานเลย บางรุ่นมีโซลินอยด์วาล์วไว้ปิดการทำงานเมื่อไม่ต้องการ reheat</p><p><b>สารในท่อ:</b> มักเป็นสารทำความเย็นกลุ่มเดียวกับน้ำยาแอร์ เช่น R-134a เติมมาจากโรงงาน ไม่ต้องเติมหรือดูแลน้ำยา</p>'],
dfan:['พัดลม DOAS','<p>ส่งลมแห้งไปยังกล่องผสมลมของ AHU ทั้ง 2 ห้อง ปริมาณลมใหม่นี้ยังใช้รักษาแรงดันบวกของห้องด้วย</p>'],
dcu:['คอนเดนซิ่งยูนิต (ของ DOAS)','<p>มีคอมเพรสเซอร์และคอนเดนเซอร์ ตั้งภายนอก ส่งน้ำยาเย็นมาที่คอยล์ DX แล้วรับน้ำยากลับไป ท่อน้ำยาไป-กลับเป็นคนละวงจรกับท่อฮีทไปป์</p>']}};

[320,380,520,580].forEach(x=>s+=L('air',`M${x} 112 L${x} 296`));

s+=L('air','M140 486 L140 540',1)+L('air','M760 486 L760 540',1);

text:()=>`<h2>ห้องผ่าตัดและ laminar airflow</h2>
<p>ลมสะอาดที่ผ่านแผง <b>HEPA H14</b> บนเพดาน ไหลลงมาตรงๆ ในทิศทางเดียวด้วยความเร็วต่ำ ไม่หมุนวนเหมือนหัวจ่ายลมทั่วไป ทำหน้าที่เหมือน<b>ม่านอากาศสะอาด</b>คลุมโซนเตียงผ่าตัด ไล่เชื้อโรคและฝุ่นออกจากแผลผ่าตัด ลงไปที่ช่องลมกลับระดับพื้น โซนใต้แผงจึงสะอาดระดับประมาณ <b>ISO 5</b></p>
${chips([['18°C','อุณหภูมิ'],['40–50%','ความชื้น'],['25–35','ACH'],['0.13–0.18','m/s หน้าแผง'],['≤ 55','dB(A)'],['+10–15','Pa']])}
<h3>ค่าที่ใช้ออกแบบ</h3>
<ul><li>แผงคลุมเตียงและเลยขอบอย่างน้อย ~30 ซม. ทุกด้าน ห้องทั่วไปใช้ราว 2.4 × 3.0 ม.</li><li>ช่องลมกลับอย่างน้อย 2 จุด ใกล้พื้น อยู่มุมตรงข้ามกัน</li><li>ลมจ่ายต่างจากห้องแค่ 1–3°C ถ้าเย็นเกิน ลมตกเร็วและปั่นป่วน ถ้าอุ่นเกิน ลมลงไม่ถึงเตียง</li><li>ASHRAE 170 กำหนดแรงดันบวกขั้นต่ำ +2.5 Pa งานออกแบบนิยม +8 ถึง +15 Pa</li></ul>
<h3>ข้อควรระวัง</h3>
<ul><li>โคมผ่าตัดและแขนเพนแดนท์ขวางทางลม เลือกรุ่นที่ลมผ่านได้ดี</li><li>ห้ามวางของขวางช่องลมกลับ</li><li>ปิดประตูระหว่างผ่าตัด</li><li>ทดสอบรอยรั่ว HEPA หลังติดตั้งและทุกปี วัดความเร็วลมหน้าแผงตามรอบ PM</li></ul>
<p>ห้องผ่าตัดผู้ป่วยติดเชื้อทางอากาศ (เช่น วัณโรค) ใช้ความดันลบ และควรมี anteroom</p>${HINT}`,
items:{
panel:['แผง laminar + HEPA H14','<p>แผงจ่ายลมบนเพดานเหนือเตียง ลมผ่าน HEPA H14 ที่กรองอนุภาคได้ 99.995% แล้วไหลลงตรงด้วยความเร็ว ~0.13–0.18 m/s ลมช้าจึงเสียงเบา ช่วยให้ได้ตามเป้า ≤ 55 dB(A)</p>'],
light:['โคมผ่าตัด','<p>ขวางทางลมที่ไหลลงมา ทำให้ใต้โคมมีจุดลมวน ควรเลือกรุ่นที่ออกแบบให้ลมผ่านได้ และไม่บังโซนแผลตลอดเวลา</p>'],
table:['เตียงผ่าตัด','<p>อยู่กลางโซนสะอาดใต้แผง laminar ลมไหลลงคลุมแผล แล้วแยกออกสองข้างไปยังช่องลมกลับ</p>'],
iso:['โซนสะอาด ISO 5','<p>มาตรฐานความสะอาดของอากาศตาม ISO 14644-1 ระดับ 5 กำหนดให้มีอนุภาคขนาด 0.5 ไมครอนขึ้นไปไม่เกิน 3,520 อนุภาคต่ออากาศ 1 ลูกบาศก์เมตร ตัวเลขระดับยิ่งน้อยยิ่งสะอาด อากาศในห้องทั่วไปอยู่ราว ISO 8–9</p>'],
grille:['ช่องลมกลับระดับพื้น','<p>ขอบล่างสูงจากพื้นไม่เกิน ~20 ซม. อย่างน้อย 2 จุดในมุมตรงข้าม ดึงลมที่พาเชื้อและฝุ่นออกจากห้อง ห้ามมีตู้หรือรถเข็นขวาง</p>'],
press:['แรงดันบวก','<p>จ่ายลมเข้ามากกว่าดูดออก อากาศจึงไหลออกจากห้องผ่าตัดไปทางเดิน เชื้อโรคจากภายนอกเข้าไม่ได้ ควรมีจอแสดงแรงดันหน้าห้องและสัญญาณเตือน</p>'],
rsensor:['เซนเซอร์อุณหภูมิและความชื้น','<p>ส่งค่าให้ระบบควบคุม AHU ตั้งเตือนเมื่อความชื้นเกิน 55% (เข้มกว่าเพดาน 60% ของ ASHRAE) เพื่อให้แก้ทันก่อนหลุดเกณฑ์</p>'],
door:['ประตู','<p>การเปิดประตูบ่อยทำให้แรงดันห้องตกและทิศทางลมเสีย ควรปิดระหว่างผ่าตัด และมีตัวปิดประตูอัตโนมัติ</p>']}};

const CMP={
sys:{n:'DOAS กับ Cool–Reheat',sub:'ห้องผ่าตัด 2 ห้อง · 18°C · RH 40–50% · 25–35 ACH',
body:()=>tbl(['หัวข้อ','DOAS','Cool–Reheat'],[['หลักการ','รีดความชื้นเฉพาะอากาศภายนอก แยกจากการคุมอุณหภูมิ','ทำลมทั้งหมดให้เย็นจัด แล้วอุ่นกลับ'],['ลมที่ต้องทำเย็นถึง ~5–6°C','~1,100 m³/h (เฉพาะอากาศนอก รวม 2 ห้อง)','~3,240 m³/h ต่อห้อง (ลมทั้งหมด)'],['คอยล์ใน AHU','คอยล์แห้ง (น้ำชิล)','คอยล์เปียก (น้ำชิล + DX)'],['Reheat ต่อห้อง','Heater 1–3 kW','~10 kW'],['คุมความชื้น 40–50%','เสถียร','ยากกว่า'],['ค่าลงทุน','สูงกว่า','ต่ำกว่า'],['ค่าไฟระยะยาว','ต่ำ','สูง'],['ความซับซ้อน','มากกว่า','น้อยกว่า'],['ชื่อเรียกอื่น','DOAS + Recirculation AHU, MAU + Dry Coil','Overcool and Reheat, CV Reheat']]),
text:'<h2>DOAS กับ Cool–Reheat</h2><p>สองระบบนี้ต่างกันที่<b>จุดที่รีดความชื้น</b> DOAS รีดเฉพาะอากาศภายนอกที่เป็นแหล่งความชื้นหลัก ส่วน Cool–Reheat รีดลมทั้งหมดแล้วต้องอุ่นกลับทั้งหมด</p><h3>เหมาะกับกรณีไหน</h3><ul><li><b>DOAS:</b> ต้องการความชื้นต่ำและเสถียร (40–50%) ใช้งานทุกวัน หลายห้อง เน้นค่าไฟระยะยาว</li><li><b>Cool–Reheat:</b> ต้องการความชื้นแค่ไม่เกิน 60% ห้องน้อย ใช้งานไม่บ่อย หรืองบลงทุนจำกัด</li></ul><p><b>สำหรับโครงการนี้:</b> เงื่อนไข 18°C, RH 40–50%, 25–35 ACH, เสียง ≤ 55 dB(A) และใช้งานทุกวัน <b>DOAS เหมาะกว่า</b> ส่วนต่างค่าลงทุนมักคืนทุนได้จากค่าไฟที่ลดลง</p>'},
rh:{n:'Reheat 3 แบบ',sub:'Heater ไฟฟ้า · Hot gas · Heat pump',
body:()=>tbl(['หัวข้อ','Heater','Hot gas','Heat pump'],[['ราคาติดตั้ง',st(5),st(2),st(2)+' ('+st(3)+' ถ้าหลายห้อง)'],['ค่าไฟ / ค่าใช้งาน',st(1),st(5),st(4)],['ความแม่นยำ',st(5),st(3),st(4)],['ค่าดูแลซ่อมบำรุง',st(5),st(2),st(3)],['เข้ากับระบบน้ำชิล',st(5),st(1)+' (ต้องมี DX)',st(5)],['สิ่งที่ต้องติดเพิ่ม','สายไฟ 3 เฟส + SCR','ท่อน้ำยา 2 เส้น + วาล์ว 3 ทาง','ฮีทปั๊ม ถัง ปั๊ม ท่อน้ำร้อน'],['เหมาะกับ','ตัวปรับละเอียด / สำรอง','ระบบ DX ใช้งาน 24 ชม.','ระบบน้ำชิล หลายห้อง']])+'<p class="sub">★ มาก = ดีกว่า (ราคาติดตั้ง ★★★★★ = ถูกที่สุด)</p>',
text:'<h2>Reheat 3 แบบ</h2><ul><li><b>Heater:</b> ลงทุนต่ำและแม่นที่สุด แต่ค่าไฟสูงที่สุดถ้าใช้เป็นตัวหลัก เหมาะกับงาน trim ในระบบ DOAS</li><li><b>Hot gas:</b> ค่าไฟ reheat ต่ำที่สุดเพราะใช้ความร้อนทิ้ง แต่ต้องมีระบบ DX และคุมได้แม่นน้อยกว่า</li><li><b>Heat pump:</b> ประหยัดกว่า heater 3–4 เท่า และแม่นยำ เพราะแยกวงจรจากคอยล์เย็น คุ้มเมื่อมีหลายห้อง</li></ul><p>ตัวเลขราคาเป็นค่าประมาณ ควรขอใบเสนอราคาจริงมาเปรียบเทียบ</p>'},
ctl:{n:'การควบคุม: Hot gas กับ Heat pump',sub:'ทำไม heat pump คุมอุณหภูมิได้นิ่งกว่า',
body:()=>tbl(['หัวข้อ','Hot gas','Heat pump'],[['วงจรควบคุม','ผูกกับคอมเพรสเซอร์ของคอยล์ DX ปรับ reheat แล้วกระทบความเย็นด้วย','แยกอิสระ ฮีทปั๊มคุมน้ำในถัง วาล์วน้ำร้อนคุมลม'],['แหล่งความร้อนสำรอง','ไม่มี ขึ้นกับคอมเพรสเซอร์ ณ ขณะนั้น','มีถังน้ำร้อน อุณหภูมิคงที่ ดึงใช้ได้ทันที'],['ตัวปรับ','วาล์วน้ำยา หรือโซลินอยด์เปิด-ปิด','วาล์วน้ำแบบหรี่ ต่อเนื่อง 0–100%'],['การตอบสนอง','แก๊สเปลี่ยนสถานะและแรงดันเร็ว อุณหภูมิแกว่งได้','น้ำเก็บความร้อนได้มาก เปลี่ยนแปลงนุ่มนวล'],['ความแม่นยำ','±0.5–2°C','±0.3–0.5°C']]),
text:'<h2>การควบคุมอุณหภูมิ: Hot gas กับ Heat pump</h2><p>เรียงตามความแม่นยำ: <b>Heater (±0.2–0.5°C) > Heat pump (±0.3–0.5°C) > Hot gas (±0.5–2°C)</b></p><ol><li><b>วงจรแยกกัน:</b> heat pump ไม่รบกวนคอยล์เย็น ส่วน hot gas ใช้คอมเพรสเซอร์ร่วมกับคอยล์ DX</li><li><b>มีถังน้ำร้อน:</b> ความร้อนพร้อมใช้เสมอ แม้ภาระความเย็นต่ำ</li><li><b>วาล์วน้ำหรี่ได้ละเอียด:</b> ตอบสนองเป็นเส้นตรงและคาดเดาได้</li><li><b>น้ำเปลี่ยนอุณหภูมิช้า:</b> ไม่กระชาก</li></ol><p>Heater แม่นที่สุดเพราะ SCR หรี่ไฟได้ทันที ในทางปฏิบัติ hot gas แบบวาล์วหรี่ร่วมกับคอมเพรสเซอร์อินเวอร์เตอร์ก็คุมได้ดีพอ และหลายโครงการติด heater ตัวเล็กไว้ปรับละเอียดอีกชั้น</p>'},
chw:{n:'ระบบน้ำชิลกับแอร์แยกส่วน',sub:'เมื่อไหร่ควรใช้ระบบส่วนกลาง',
body:()=>tbl(['หัวข้อ','ระบบน้ำชิล','แอร์แยกส่วน / VRF'],[['ค่าไฟ','~0.55–0.7 kW ต่อตันความเย็น','~1.0–1.3 kW ต่อตัน'],['ระยะส่งความเย็น','หลายร้อยเมตร ทุกชั้น','จำกัดด้วยความยาวท่อน้ำยา'],['ความปลอดภัย','ในอาคารมีแต่ท่อน้ำ','มีน้ำยาแอร์ในพื้นที่ที่มีคน'],['ขนาดเครื่องรวม','เล็กกว่าผลรวมทุกห้อง','เท่ากับผลรวมทุกห้อง'],['เครื่องสำรอง','N+1 ส่วนกลางได้ง่าย','ต้องสำรองทีละจุด'],['การดูแล','รวมที่ห้องเครื่อง ต้องดูแลคุณภาพน้ำ','คอมเพรสเซอร์กระจายทั่วอาคาร'],['อายุใช้งาน','20–30 ปี','10–15 ปี'],['ค่าลงทุน','สูง','ต่ำกว่าสำหรับอาคารเล็ก']]),
text:'<h2>ระบบน้ำชิลกับแอร์แยกส่วน</h2><p>ในอาคารใหญ่อย่างโรงพยาบาล ระบบน้ำชิลส่วนกลางประหยัดกว่า ดูแลง่ายกว่า และเชื่อถือได้มากกว่า</p><h3>เมื่อไหร่แอร์แยกหรือ VRF เหมาะกว่า</h3><ul><li>อาคารเล็กหรือห้องไม่มาก</li><li>ห้องที่ใช้งานคนละเวลากับส่วนอื่นของอาคาร</li><li>งานที่ต้องเย็นกว่าที่น้ำชิลทำได้ เช่น คอยล์ DX ที่รีดความชื้นให้ถึงจุดน้ำค้าง ~5°C</li></ul><p><b>ระบบที่ออกแบบไว้จึงใช้ร่วมกัน:</b> น้ำชิลรับภาระความเย็นส่วนใหญ่อย่างประหยัด และ DX ช่วยเฉพาะช่วงที่ต้องเย็นจัด</p>'},
hp:{n:'Heat pipe กับ Heat recovery heat pump',sub:'อุปกรณ์ย้ายความร้อน 2 แบบ',
body:()=>tbl(['หัวข้อ','Heat pipe','Heat recovery heat pump'],[['การใช้ไฟ','ไม่ใช้','ใช้ (คอมเพรสเซอร์)'],['ชิ้นส่วนเคลื่อนที่','ไม่มี','มี'],['ทิศทางความร้อน','จากที่ร้อนไปที่เย็นเท่านั้น','จากที่เย็นไปที่ร้อนได้'],['สื่อที่ใช้','ลม (ติดคร่อมคอยล์ใน AHU)','น้ำ (ผลิตน้ำเย็นและน้ำร้อนส่งไปคอยล์)'],['ราคา / การดูแล','ถูก ดูแลแทบไม่ต้อง','แพง ดูแลเหมือนชิลเลอร์'],['เหมาะกับ','pre-cool + reheat ใน DOAS','โครงการหลายห้องที่ต้องการทั้งน้ำเย็นและน้ำร้อน']]),
text:'<h2>Heat pipe กับ Heat recovery heat pump</h2><p>ทั้งสองแบบย้ายความร้อนจากที่หนึ่งไปอีกที่หนึ่ง แต่ heat pipe ทำได้เองโดยไม่ใช้ไฟ ส่วน heat recovery heat pump ใช้คอมเพรสเซอร์ จึงย้ายความร้อนจากที่เย็นไปที่ร้อนได้</p><p><b>สำหรับโครงการนี้แนะนำ heat pipe</b> เพราะราคาถูก ไม่ใช้ไฟ ดูแลง่าย ส่วน heat recovery heat pump ไม่จำเป็น เพราะมีแค่ 2 ห้อง และน้ำเย็น ~5°C ที่เครื่องผลิตได้ยังรีดความชื้นให้ถึง 40–50% ไม่พอ ต้องใช้คอยล์ DX อยู่ดี</p>'},
ceil:{n:'ฝ้าแซนวิชพาเนลกับคอมแพคลามิเนต',sub:'วัสดุฝ้าเพดานห้องผ่าตัด',
body:()=>tbl(['หัวข้อ','แซนวิชพาเนล','คอมแพคลามิเนต'],[['โครงสร้าง','ผิวเหล็กเคลือบสี/สแตนเลส ไส้ฉนวน PU/PIR/ร็อควูล','แผ่นลามิเนตอัดแน่นเนื้อเดียว'],['ฉนวนในตัว','มี กันหยดน้ำเกาะ','ไม่มี ต้องติดฉนวนเพิ่ม'],['น้ำหนัก','เบาเมื่อเทียบกับความแข็งแรง','หนัก (~14 กก./ตร.ม. ที่ 10 มม.)'],['เดินบนฝ้าได้','ได้ (แบบ walkable)','ไม่ได้'],['รอยต่อ','น้อย แผ่นยาวได้หลายเมตร','มากกว่า ขนาดแผ่นจำกัด'],['ผิวทนทาน','ดี','ดีกว่า ทนรอยขีดข่วน แรงกระแทก และสารเคมี'],['ทนน้ำ','ดี','100% ไม่มีไส้ที่จะบวม'],['ราคารวมโครงและฉนวน','ถูกกว่า','แพงกว่า'],['กันไฟ','ใช้ไส้ร็อควูลหรือ PIR','ใช้เกรด FR']]),
text:'<h2>ฝ้าแซนวิชพาเนลกับคอมแพคลามิเนต</h2><p>สำหรับ<b>ฝ้าเพดาน</b>ห้องผ่าตัด <b>แซนวิชพาเนลเหมาะกว่า</b> เพราะมีฉนวนในตัว เบา เดินบนฝ้าได้ และรอยต่อน้อย ช่วยรักษาแรงดันบวกได้ดี</p><p>คอมแพคลามิเนตเด่นเรื่องผิวทนทาน จึงนิยมใช้ทำ<b>ผนังช่วงล่าง</b> (สูงราว 1.2–1.5 ม.) หรือโซนที่รถเข็นเตียงชนบ่อย</p><h3>ข้อควรระวังของฝ้าแซนวิชพาเนล</h3><ul><li>ไส้ PU ติดไฟได้ ในโรงพยาบาลควรใช้ไส้ร็อควูลหรือ PIR ที่ผ่านมาตรฐานกันไฟ</li><li>วางแผนช่องเปิดให้ครบตั้งแต่ต้น ทั้งโคม หัวจ่ายลม แผง laminar และจุดแขวนโคมผ่าตัด</li><li>โคมผ่าตัดและเพนแดนท์ต้องยึดกับโครงสร้างเหล็กเหนือฝ้า ห้ามแขวนกับแผ่นฝ้า</li></ul>'}};
V.compare={name:'เปรียบเทียบ',legend:()=>[],html:1,
tabsFn:()=>Object.entries(CMP).map(([k,o])=>[k,o.n]),
svg:()=>{const o=CMP[S.cmp];return `<div class="cmpwrap"><div class="cmpcard"><h2>${o.n}</h2><p class="sub">${o.sub}</p>${o.body()}</div></div>`},
text:()=>CMP[S.cmp].text,items:{}};

const ORDER=['overview','chw','valves','ahu','reheat','doas','room','compare'];
const $=id=>document.getElementById(id);
const nav=$('nav'),dia=$('dia'),panel=$('panel'),tabs=$('tabs'),legend=$('legend');
nav.innerHTML=ORDER.map(k=>`<button data-go="${k}">${V[k].name}</button>`).join('');
function render(){
const v=V[S.view];
nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===S.view?'page':'false'));
$('m-doas').setAttribute('aria-pressed',S.mode==='doas');$('m-rh').setAttribute('aria-pressed',S.mode==='reheat');
if(v.tabs)tabs.innerHTML=v.tabs.map(([k,n])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${n}</button>`).join('');
else if(v.tabsFn)tabs.innerHTML=v.tabsFn().map(([k,n])=>`<button data-cmp="${k}" aria-pressed="${S.cmp===k}">${n}</button>`).join('');
else tabs.innerHTML='';
dia.innerHTML=v.svg();
legend.innerHTML=v.legend().map(k=>{const[n,c,dash]=LEG[k];return `<span><i style="border-top-color:${COL[c]};${dash?'border-top-style:dashed':''}"></i>${n}</span>`}).join('');
if(S.info&&v.items[S.info]){const[t,h]=v.items[S.info];panel.innerHTML=`<button class="back" data-back="1">← กลับไปคำอธิบายหน้านี้</button><h2>${t}</h2>${h}`;dia.querySelectorAll(`[data-i="${S.info}"]`).forEach(g=>g.classList.add('sel'))}
else panel.innerHTML=v.text();
document.title=S.view==='overview'?'ระบบปรับอากาศห้องผ่าตัด':`${v.name} · ระบบปรับอากาศห้องผ่าตัด`;
}
function go(k){if(!V[k])return;S.view=k;S.info=null;if(location.hash!=='#'+k)location.hash=k;render();panel.scrollTop=0;dia.scrollTop=0}
function togglePanel(force){const hide=force===true?false:!document.body.classList.contains('nopanel');document.body.classList.toggle('nopanel',hide);$('ptgl').textContent=hide?'แสดงคำบรรยาย':'ซ่อนคำบรรยาย';$('ptgl').setAttribute('aria-expanded',String(!hide))}
function act(t){
const g=t.closest('[data-go],[data-i],[data-tab],[data-cmp],[data-mode],[data-back]');if(!g)return false;
if(g.dataset.back){S.info=null;render();return true}
if(g.dataset.mode){S.mode=g.dataset.mode;S.info=null;try{localStorage.setItem('or-mode',S.mode)}catch(e){}render();return true}
if(g.dataset.tab){S.tab=g.dataset.tab;S.info=null;render();return true}
if(g.dataset.cmp){S.cmp=g.dataset.cmp;render();panel.scrollTop=0;dia.scrollTop=0;return true}
if(g.dataset.go){go(g.dataset.go);return true}
if(g.dataset.i){S.info=g.dataset.i;render();if(document.body.classList.contains('nopanel'))togglePanel(true);panel.scrollTop=0;return true}
return false}
document.addEventListener('click',e=>{act(e.target)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();act(e.target)}});
$('ptgl').addEventListener('click',()=>togglePanel());
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==S.view){S.view=h;S.info=null;render()}});
const h0=location.hash.slice(1);if(V[h0])S.view=h0;
if(matchMedia('(max-width:760px)').matches)togglePanel();
render();
}
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
